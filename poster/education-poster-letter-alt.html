<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<title>ICS Education Poster (Alt)</title>
<meta name="description" content="Print-ready 8.5×11 office-printer poster for Educational Leadership at ICS, alternate version in the style of the F2BF 11×17 poster, with a QR code to education.icscanada.edu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   EDUCATIONAL LEADERSHIP AT ICS — 8.5×11 office-printer poster, ALT
   Same layout as the F2BF 11×17 poster (f2bf/poster/index-v2.html),
   rendered in the education site's palette and faces: full-panel
   graduates photo fading into ICS deep purple, everything anchored
   bottom-left, QR in a cream tile bottom-right.
   Sheet: US Letter. No bleed — artwork sits inside a 0.3in paper
   margin so any desktop/office printer reproduces it whole.
   ════════════════════════════════════════════════════════════════ */

:root {
  --purple-deep: #1F0F3D;
  --red:         #C83C2C;
  --coral:       #E8896B;
  --orange-lt:   #F5C48F;
  --cream:       #FAF7F2;

  --display: 'Libre Baskerville', Georgia, serif;
  --text:    'Outfit', 'Segoe UI', Arial, sans-serif;

  --margin: 0.3in;   /* paper border */
  --safe:   0.4in;   /* inner gutter of the artwork */
}

@page { size: 8.5in 11in; margin: 0; }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #d9d5de;
  font-family: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.stage { display: flex; justify-content: center; padding: 0.5in 0; }

.sheet {
  width: 8.5in; height: 11in;
  padding: var(--margin);
  background: #fff;
  box-shadow: 0 10px 40px rgba(31, 15, 61, 0.25);
}
@media print {
  html, body { background: #fff; }
  .stage { padding: 0; }
  .sheet { box-shadow: none; }
}

.poster {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--purple-deep);
}

/* ════ Photo layer ════ */
.cover__photo {
  position: absolute; top: 0; left: 0; right: 0;
  height: 6.7in;                 /* photo's own aspect at panel width */
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
          mask-image: linear-gradient(180deg, #000 55%, transparent 100%);
  background-image: url('../assets/images/Education-grads-2026.jpg');
  background-size: cover;        /* fit width: keeps all three graduates */
  background-position: 50% 0%;
  opacity: 0.6;
  filter: saturate(0.4) contrast(1.05);
}
.cover__gradient {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(31,15,61,0.12) 0%,
    rgba(31,15,61,0.04) 14%,
    rgba(31,15,61,0.10) 32%,
    rgba(31,15,61,0.50) 50%,
    rgba(31,15,61,0.84) 64%,
    rgba(31,15,61,0.96) 80%,
    rgba(31,15,61,0.99) 100%);
}

/* ════ Content ════ */
.safe-area {
  position: absolute;
  inset: var(--safe);
  color: var(--cream);
  z-index: 2;
}

.eyebrow {
  position: absolute; top: 0; left: 0;
  font-size: 9pt; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(250,247,242,0.72);
}
.logo {
  position: absolute; top: -0.04in; right: 0;
  width: 0.85in; height: auto;
  opacity: 0.9;
}

.bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: flex-end;
}
.text-stack { flex: 1; min-width: 0; }

.wordmark {
  font-family: var(--display);
  font-weight: 700;
  font-size: 54pt;
  line-height: 1.02;
  letter-spacing: -0.02em;
  color: var(--cream);
}
.wordmark em {
  font-style: italic; font-weight: 400;
  color: var(--orange-lt);
}

.tagline {
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: 14pt;
  color: rgba(250,247,242,0.86);
  margin-top: 0.2in;
  max-width: 4.6in;
  line-height: 1.45;
  text-wrap: balance;
}

.manifesto {
  margin-top: 0.38in;
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: 12.5pt; line-height: 1.7;
  color: rgba(250,247,242,0.82);
}
.manifesto__rule {
  width: 28px; height: 2px;
  background: var(--red); border: 0;
  margin-top: 0.2in;
}
.pillars {
  margin-top: 0.14in;
  font-size: 8.5pt; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(250,247,242,0.7);
}
.pillars__sep { display: inline-block; margin: 0 0.1in; color: var(--red); }

/* ════ QR group ════ */
.qr-group {
  display: flex; align-items: flex-end; gap: 0.18in;
  flex-shrink: 0; margin-left: 0.3in;
}
.qr-group__text { text-align: right; padding-bottom: 0.08in; }
.qr-group__label {
  font-size: 7.5pt; font-weight: 700;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--coral);
  margin-bottom: 0.06in;
}
.qr-group__url {
  font-family: var(--display); font-weight: 700;
  font-size: 11.5pt; letter-spacing: 0;
  color: var(--cream);
}
.qr__code {
  width: 1.45in; height: 1.45in;
  background: var(--cream);
  padding: 0.06in;
  border-radius: 5px;
  box-shadow: 0 0 0 1px rgba(200,60,44,0.2), 0 4px 14px rgba(0,0,0,0.25);
  flex-shrink: 0;
}
.qr__code svg { display: block; width: 100%; height: 100%; }
.qr__code .qr__quiet { fill: var(--cream); }
.qr__code .qr__mod   { fill: var(--purple-deep); }
</style>
</head>
